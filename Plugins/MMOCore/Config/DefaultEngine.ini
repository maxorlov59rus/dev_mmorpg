; MMOCore plugin default config (UE5.8).
; Слияется с DefaultEngine.ini проекта при сборке; секция читается в AMMOGameInstance::Init().

[/MMOCore.Network]
AutoConnect=True
AuthHost=127.0.0.1
AuthPort=8085
LoginHost=127.0.0.1
LoginPort=8091
ChatHost=127.0.0.1
ChatPort=8093

; Android-билд переопределяет endpoints через -ini:Engine:[/MMOCore.Network]:AuthHost=...
; или packaging settings override (см. docs/04-Клиент-UE5.8.md)
