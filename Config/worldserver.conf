# worldserver.conf — конфигурация world/map сервера
[WorldServer]
BindIP = 0.0.0.0
Port = 8093
Protocol = KCP
MaxConnections = 5000
LogLevel = 2

[Database]
# MySQL connection pool (dm_characters, dm_world)
Host = 127.0.0.1
Port = 3306
User = dm_world
Password = dm_world_pass
Database = dm_world
PoolSize = 20
MaxPoolSize = 50
ConnectionTimeout = 5000
QueryTimeout = 10000
AutoCreate = true

[Logging]
LogFile = logs/worldserver.log
MaxFileSize = 10485760
MaxFiles = 5
ConsoleOutput = true

[ZoneManager]
ZoneCacheSize = 10000
TeleportCooldown = 3000

[PvP]
HonorGainMultiplier = 1.0
RepLossMultiplier = 1.0
CombatTimeoutSec = 6

[Events]
EventCheckIntervalMs = 1000
>