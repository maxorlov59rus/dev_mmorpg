; Copyright BlackMatter Team. Project default engine config — UE 5.8.
; Сетевые дефолты MMOCore (/MMOCore.Network) объявлены в
; Plugins/MMOCore/Config/DefaultEngine.ini и сливаются с этим файлом при сборке.

[/Script/Engine.Engine]
; Синхронизация с серверным тиком 50 Гц (docs/00 §2): клиентский tick-интервал не должен
; уходить дальше серверного frame window.
bUseFixedFrameRate=False

[/Script/Engine.GameSession]
; Клиент НЕ использует UE replication (ADR-002): dedicated server client-ов не принимает.
MaxPlayers=1

[/MMOCore.Network]
; Прод-эндпоинты задаются через staging override / -ini: командной строкой; здесь — dev-стенд.
AutoConnect=True
AuthHost=127.0.0.1
AuthPort=8085
LoginHost=127.0.0.1
LoginPort=8091
ChatHost=127.0.0.1
ChatPort=8093

[LogFiles]
PurgeLogsDays=7
