# authserver.conf — конфигурация сервера авторизации
[AuthServer]
BindIP = 0.0.0.0
Port = 8091
MaxConnections = 1000
LogLevel = 2  # 0=debug,1=info,2=warn,3=error

[Database]
# MySQL connection pool
Host = 127.0.0.1
Port = 3306
User = dm_auth
Password = dm_auth_pass
Database = dm_auth
PoolSize = 10
MaxPoolSize = 20
ConnectionTimeout = 5000
QueryTimeout = 10000
AutoCreate = true

[Logging]
LogFile = logs/authserver.log
MaxFileSize = 10485760  # 10 MB
MaxFiles = 5
ConsoleOutput = true

[SRP]
# SRP-6a parameters (RFC 5054)
N = 2048
g = 2
k = 3
SaltSize = 16
>