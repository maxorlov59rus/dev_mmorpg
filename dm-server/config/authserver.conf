; Auth Server Configuration

[Network]
; Port for client connections (TCP)
client_port = 8091
; Bind address
bind_address = 0.0.0.0

[Database]
; MySQL connection settings
host = 127.0.0.1
port = 3306
user = mmorpg
password = mmorpg_pass
database = mmorpg_auth
pool_size = 5

[Logging]
; Log file path
file = logs/authserver.log
; Log level: DEBUG, INFO, WARN, ERROR, AUDIT
level = INFO
; Console output enabled
console = true
; File output enabled
file_output = true

[Server]
; Server name
name = AuthServer