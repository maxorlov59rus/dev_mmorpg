; World Server Configuration

[Network]
; Port for client connections (UDP)
client_port = 8093
; Port for server-server connections (TCP)
server_port = 8094
; Auth server address (for server-server connection)
auth_server_host = 127.0.0.1
auth_server_port = 8091
; Bind address
bind_address = 0.0.0.0

[Database]
; MySQL connection settings
host = 127.0.0.1
port = 3306
user = mmorpg
password = mmorpg_pass
database = mmorpg_world
pool_size = 10

[Logging]
; Log file path
file = logs/worldserver.log
; Log level: DEBUG, INFO, WARN, ERROR, AUDIT
level = INFO
; Console output enabled
console = true
; File output enabled
file_output = true

[Server]
; Server name
name = WorldServer
; Max players
max_players = 1000
; Zone map
zone_map = default

[AutoPvP]
; Enable Ghost Arena auto-PvP
ArenaEnabled = 1
; Minimum player level to participate
MinPlayerLevel = 10
; Clone pool size (max offline players to clone)
ClonePoolSize = 100
; Clone refresh interval (hours)
CloneRefreshHours = 24
; Max matches per day per player
MaxMatchesPerDay = 10
; Daily faith points cap
FaithPointsDailyCap = 500
; Clone stat variance (0.0-1.0)
CloneStatVariance = 0.1
; AI think interval (ms)
AiThinkIntervalMs = 500
; Match duration (seconds)
MatchDurationSec = 120
; Respawn delay (seconds)
RespawnDelaySec = 5
; Ghost Arena map ID
GhostArenaMapId = 200
; Clone selection mode: random, level_match, faction_match
CloneSelectionMode = random

[SeasonalEvents]
; Enable seasonal events
SeasonalEventsEnabled = 1
; Auto start by schedule
AutoStart = 1
; Notification hours before event start
NotificationHoursBefore = 24
; Max participants per event
MaxParticipants = 1000
; Reward multiplier
RewardMultiplier = 1.0
; Seasonal currency cap
SeasonalCurrencyCap = 10000
; Event duration (days)
EventDurationDays = 30

[Rates]
; Experience rate multiplier (1.0 = normal, 2.0 = double XP)
XPRate = 1.0
; Drop rate multiplier for items
DropRate = 1.0
; Drop rate multiplier for gold
GoldRate = 1.0
; Reputation gain rate multiplier
ReputationRate = 1.0
; Honor points gain rate multiplier
HonorRate = 1.0
; Crafting skill gain rate multiplier
CraftingRate = 1.0
; Gathering skill gain rate multiplier
GatheringRate = 1.0
; Rest experience bonus multiplier
RestXPRate = 2.0
; Quest reward money multiplier
QuestMoneyRate = 1.0
; Quest reward XP multiplier
QuestXPRate = 1.0
; PvP honor kill multiplier
PvPHonorRate = 1.0
; Spirit XP gain rate multiplier
SpiritXPRate = 1.0
; Seasonal event reward multiplier
SeasonalRewardRate = 1.0
; Misty Anomaly score multiplier
MistyAnomalyRate = 1.0
; Housing System Configuration
; ----------------------------------------
; Enable housing system
HousingSystemEnabled = 1
; Maximum number of houses per player
MaxHousesPerPlayer = 1
; Default construction time in seconds (5 minutes)
DefaultConstructionTime = 300
; Gold cost for small house
SmallHouseCost = 100
; Gold cost for medium house
MediumHouseCost = 500
; Gold cost for large house
LargeHouseCost = 1500
; Gold cost for mansion
MansionCost = 5000
; Hourly gold income from farms
FarmGoldRate = 10
; Hourly spirit income from farms
FarmSpiritRate = 5
; Farm plot size in meters
FarmPlotSize = 25
; Default buff duration in hours
BuffDurationHours = 24
; Enable weekend bonus on farm rates
WeekendFarmBonus = 1
; Enable weekend bonus rates
WeekendBonusEnabled = 1
; Weekend XP rate multiplier (applied on top of base rate)
WeekendXPMultiplier = 2.0
; Weekend drop rate multiplier
WeekendDropMultiplier = 2.0
; Weekend gold rate multiplier
WeekendGoldMultiplier = 2.0
; Weekend reputation rate multiplier
WeekendReputationMultiplier = 2.0
; Weekend crafting rate multiplier
WeekendCraftingMultiplier = 2.0
; Weekend gathering rate multiplier
WeekendGatheringMultiplier = 2.0
; Weekend quest reward multiplier
WeekendQuestMultiplier = 2.0
; Weekend spirit XP multiplier
WeekendSpiritXPMultiplier = 2.0
; Days considered weekend (0=Sunday, 6=Saturday)
WeekendDays = 0,6
; Contamination System Configuration
; ----------------------------------------
; Enable contamination system
ContaminationEnabled = 1
; Contamination tick interval in seconds
ContaminationTickInterval = 60
; Contamination cure item ID
ContaminationCureItem = 10001
; Contamination cure cost in gold
ContaminationCureCost = 100
; Contamination spread chance per tick
ContaminationSpreadChance = 15
; Contamination decay per tick
ContaminationDecayPerTick = 1
; Minimum players required for containment
ContainmentMinPlayers = 3
; Enable weekend bonus on farm rates
WeekendFarmBonus = 1
; Enable weekend bonus rates
WeekendBonusEnabled = 1
; Weekend XP rate multiplier (applied on top of base rate)
WeekendXPMultiplier = 2.0
; Weekend drop rate multiplier
WeekendDropMultiplier = 2.0
; Weekend gold rate multiplier
WeekendGoldMultiplier = 2.0
; Weekend reputation rate multiplier
WeekendReputationMultiplier = 2.0
; Weekend crafting rate multiplier
WeekendCraftingMultiplier = 2.0
; Weekend gathering rate multiplier
WeekendGatheringMultiplier = 2.0
; Weekend quest reward multiplier
WeekendQuestMultiplier = 2.0
; Weekend spirit XP multiplier
WeekendSpiritXPMultiplier = 2.0
; Days considered weekend (0=Sunday, 6=Saturday)
WeekendDays = 0,6
EOF
